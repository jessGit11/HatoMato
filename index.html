(()=>{

const E=(cx,cy,rx,ry,fill,sw)=>`<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}"${fill?` fill="${fill}"`:''}${sw!=null?` stroke-width="${sw}"`:''}/>`;

const calyxP=(cx,cy,rx,ry)=>{const pts=[],tip=[[0,-1],[.95,-.31],[.59,.81],[-.59,.81],[-.95,-.31]];
 let d='';for(let i=0;i<5;i++){const a=tip[i],b=tip[(i+1)%5],m=[(a[0]+b[0])/2*.36,(a[1]+b[1])/2*.36];
  d+=(i?'L':'M')+f(cx+a[0]*rx)+' '+f(cy+a[1]*ry)+'Q'+f(cx+m[0]*rx)+' '+f(cy+m[1]*ry)+' '+f(cx+b[0]*rx)+' '+f(cy+b[1]*ry)}

const calyx=(cx,cy,rx,ry,fill='#8fc462',sw=.7)=>P(calyxP(cx,cy,rx,ry),fill,sw);

const heartD=(cx,cy,w,h)=>`M${f(cx)} ${f(cy)}C${f(cx-.2*w)} ${f(cy-.34*h)} ${f(cx-.58*w)} ${f(cy-.2*h)} ${f(cx-.5*w)} ${f(cy+.16*h)}C${f(cx-.45*w)} ${f(cy+.42*h)} ${f(cx-.14*w)} ${f(cy+.66*h)} ${f(cx)} ${f(cy+h)}C${f(cx+.14*w)} ${f(cy+.66*h)} ${f(cx+.45*w)} ${f(cy+.42*h)} ${f(cx+.5*w)} ${f(cy+.16*h)}C${f(cx+.58*w)} ${f(cy-.2*h)} ${f(cx+.2*w)} ${f(cy-.34*h)} ${f(cx)} ${f(cy)}Z`;

 {k:'mall',ok:()=>SCREEN==='town'&&tw().area==='s',el:()=>document.querySelector('#tart [data-t="shop:furn"]'),t:'가게를 누르면 그 가게 물건을 살 수 있어요'}];
let cur=null;
function hide(){const c=$('coach');if(c)c.remove();cur=null}
function show(g){const st=$('stage'),el=g.el();if(!st||!el)return;const r=el.getBoundingClientRect(),q=st.getBoundingClientRect();if(!r.width)return;
 const c=document.createElement('div');c.id='coach';c.innerHTML=g.t+(g.sub?`<small>${g.sub}</small>`:'')+'<small>눌러서 닫기</small>';st.appendChild(c);
 const cw=c.offsetWidth,ch=c.offsetHeight,tx=(r.left+r.right)/2-q.left;let left=Math.max(6,Math.min(q.width-cw-6,tx-cw/2)),below=r.top-q.top<q.height*.45,top=below?r.bottom-q.top+12:r.top-q.top-ch-12;
 c.className=below?'dn':'up';c.style.left=left+'px';c.style.top=Math.max(4,top)+'px';c.style.setProperty('--ax',Math.max(14,Math.min(cw-14,tx-left))+'px');
 c.onclick=e=>{e.stopPropagation();S.gd[g.k]=1;save();hide()};cur=g.k}
setInterval(()=>{if(!S.tut||busy()||P||($('md')&&getComputedStyle($('md')).display!=='none')||($('tut')&&!$('tut').hidden)){if(cur)hide();return}
 if(S.uinew){S.uinew=0;save();tModal(`<h2 style="margin:0 0 6px">화면이 바뀌었어요!</h2><p style="font-size:16px;margin:4px 0;text-align:left;line-height:1.45">· 아래 아이콘 줄이 없어지고 화면이 넓어졌어요<br>· <b>가방</b>(오른쪽 위): 인벤토리와 도감<br>· <b>톱니</b>(오른쪽 위): 설정<br>· 정원 맨 아래: <b>업적 · 집으로</b><br>· 물건은 <b>쇼핑센터</b>에서 사요 (마을 광장의 쇼핑센터 표지판) </p>`);return}
 const g=G.find(x=>!S.gd[x.k]&&x.ok());if(!g){if(cur)hide();return}if(cur===g.k)return;hide();show(g)},700)})();
