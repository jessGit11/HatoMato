.cur.r::after{left:auto;right:-4px;width:200px}.cur.r::before{left:auto;right:18px}

function svDec(s){s=(s||'').replace(/\s+/g,'');const m=/^HATO1\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/.exec(s);if(!m)return null;try{const j=decodeURIComponent(escape(atob(m[1])));let c=0;for(let i=0;i<j.length;i++)c=(c*31+j.charCodeAt(i))>>>0;if(c.toString(36)!==m[2])return null;const o=JSON.parse(j);return o&&typeof o==='object'&&typeof o.st==='number'?o:null}catch(e){return null}}
